name: displace-consumer
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        id: r
        with: { path: builddeps, key: legit-deps-v1 }
      - run: |
          echo "HIT=${{ steps.r.outputs.cache-hit }}"
          if [ -f builddeps/postinstall.sh ]; then echo "WHOSE-BYTES:"; bash builddeps/postinstall.sh
          else echo "NOTHING-RESTORED"; fi
